
spring.application.name=CloudTrapAPI

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cloudtrap}
spring.datasource.username=${DB_USERNAME:cloudtrap}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns database schema changes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Hibernate validates the schema; it does not modify it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
