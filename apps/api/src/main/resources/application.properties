
spring.application.name=CloudTrapAPI

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cloudtrap}
spring.datasource.username=${DB_USERNAME:cloudtrap}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns database schema changes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Hibernate validates the schema; it does not modify it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session cookie hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# CloudTrap security settings
cloudtrap.security.allowed-origins=${CLOUDTRAP_ALLOWED_ORIGINS:http://localhost:3000}
cloudtrap.security.cookie-secure=${SESSION_COOKIE_SECURE:false}
cloudtrap.security.cookie-same-site=${CSRF_COOKIE_SAME_SITE:Lax}

# Session lifetime
server.servlet.session.timeout=30m

# Redis: login rate limiting
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# API error response hardening
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Expose only the health endpoint over HTTP
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Flyway owns Spring Session schema creation
spring.session.jdbc.initialize-schema=never

# AWS STS endpoint region; this is not the region inventory will scan.
cloudtrap.aws.sts.region=${AWS_STS_REGION:us-east-1}


# AWS EC2 security-group discovery
cloudtrap.aws.ec2.region=${AWS_EC2_REGION:us-east-1}
cloudtrap.aws.ec2.api-call-timeout=${AWS_EC2_API_CALL_TIMEOUT:20s}
cloudtrap.aws.ec2.connection-timeout=${AWS_EC2_CONNECTION_TIMEOUT:3s}
